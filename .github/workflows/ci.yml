name: Native checks
on:
  push:
  pull_request:
jobs:
  replay:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --features test-support -- -D warnings
      - run: cargo test --workspace --locked --features test-support
      - run: python tools/check-replay-boundary.py
      - run: python tools/check-admission-boundary.py
      - run: python -m unittest discover -s tools/loader-entry-trial -p 'test_*.py'
