[package]
name = "pdx-native"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/native-evidence"]
resolver = "3"

[dependencies]
evidence = { package = "pdx-native-evidence", path = "crates/native-evidence", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
sha2 = "0.10"
