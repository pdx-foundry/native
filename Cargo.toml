[package]
name = "pdx-native"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/native-evidence"]
resolver = "3"

[dependencies]
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
evidence = { package = "pdx-native-evidence", path = "crates/native-evidence", version = "0.1.0" }
cpp_demangle = "=0.5.1"
object = { version = "=0.37.3", default-features = false, features = ["read", "std"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
capstone = { version = "=0.14.0", default-features = false, features = ["std", "full", "arch_arm64"] }
schemars = { version = "1.2.2", default-features = false, features = ["derive"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
libc = "0.2"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

# The live tests start the real game. This binary is also their supervisor process, so it has
# its own `main` in place of the standard test harness.
[[test]]
name = "live"
harness = false
