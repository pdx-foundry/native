[package]
name = "pdx-native"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/native-evidence"]
resolver = "3"

[features]
default = []
test-support = []
production = []
maintainer-tools = []

[dependencies]
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
evidence = { package = "pdx-native-evidence", path = "crates/native-evidence", version = "0.1.0" }
object = { version = "=0.37.3", default-features = false, features = ["read", "std"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
schemars = { version = "1.2.2", default-features = false, features = ["derive"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
libc = "0.2"

[build-dependencies]
sha2 = "0.10"

[[example]]
name = "investigate"
required-features = ["maintainer-tools"]

[dev-dependencies]
tempfile = "3"

[[example]]
name = "observe"
required-features = ["maintainer-tools"]

[[example]]
name = "live"
required-features = ["production"]

[[example]]
name = "registry-investigation"
required-features = ["maintainer-tools"]

[[example]]
name = "session-investigation"
required-features = ["maintainer-tools"]
