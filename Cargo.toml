[package]
name = "pdx-native"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/native-evidence"]
resolver = "3"

[features]
default = []
test-support = []
production = []
maintainer-tools = []

[dependencies]
evidence = { package = "pdx-native-evidence", path = "crates/native-evidence", version = "0.1.0" }
object = { version = "0.37.3", default-features = false, features = ["read", "std"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
